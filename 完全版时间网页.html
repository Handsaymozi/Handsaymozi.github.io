<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS - 终极自定义时钟</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@100;400;900&family=JetBrains+Mono:wght@300;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --clock-size: 8vw;
            --clock-weight: 900;
            --clock-font: 'Orbitron';
            --neon-color: #00f3ff;
            --glass-blur: 25px;
            --glass-op: 0.1;
            --grid-opacity: 0.1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            perspective: 2000px;
            transition: background 0.5s;
        }

        /* 背景层容器 */
        #bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        #fluid-canvas {
            position: absolute;
            width: 100%; height: 100%;
            filter: blur(80px);
            opacity: 0;
            transition: opacity 1s;
        }

        /* 赛博网格样式 */
        .cyber-grid {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--neon-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-color) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* 3D 核心容器 */
        #clock-wrapper {
            position: relative;
            z-index: 10;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 1, 0.2, 1);
        }

        #glass-panel {
            padding: 60px 100px;
            background: rgba(255, 255, 255, var(--glass-op));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.4);
            text-align: center;
            transform: translateZ(80px);
        }

        #time-display {
            font-family: var(--clock-font), sans-serif;
            font-size: var(--clock-size);
            font-weight: var(--clock-weight);
            line-height: 1;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 预设材质 */
        .mat-neon { text-shadow: 0 0 30px var(--neon-color), 0 0 10px var(--neon-color); color: #fff; }
        .mat-minimal { color: #fff; text-shadow: none; }
        .mat-glass { color: rgba(255,255,255,0.8); text-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .mat-outline { color: transparent; -webkit-text-stroke: 2px #fff; }

        .layer-date {
            margin-top: 20px;
            font-size: 1.1vw;
            font-family: 'Share Tech Mono', monospace;
            color: rgba(255,255,255,0.4);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* 设置菜单 */
        #menu-btn {
            position: fixed; top: 30px; right: 30px; z-index: 1100;
            padding: 10px 20px; border-radius: 12px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        #menu-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        #settings-panel {
            position: fixed; top: 0; right: -420px;
            width: 400px; height: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(40px);
            z-index: 1200; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: #eee; border-left: 1px solid rgba(255,255,255,0.1);
            padding: 40px; overflow-y: auto;
        }
        #settings-panel.active { right: 0; }

        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 11px; color: #666; margin-bottom: 8px; text-transform: uppercase; font-weight: 800; }
        
        select, input { 
            width: 100%; padding: 12px; background: #1a1a1f; border: 1px solid #333; 
            color: #fff; border-radius: 8px; font-family: inherit;
        }

        .section-title { font-size: 18px; margin: 25px 0 15px; padding-bottom: 8px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px;}
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="bg-container">
        <canvas id="fluid-canvas"></canvas>
        <div id="cyber-grid" class="cyber-grid"></div>
    </div>

    <button id="menu-btn">SETTINGS / 配置</button>

    <div id="clock-wrapper">
        <div id="glass-panel">
            <div id="time-display">00:00:00</div>
            <div id="date-display" class="layer-date">Loading...</div>
        </div>
    </div>

    <div id="settings-panel">
        <h2 style="font-weight: 900; letter-spacing: 2px;">CONFIG CENTER</h2>
        
        <div class="section-title"><span>🖼️</span> 背景样式</div>
        <div class="control-group">
            <label>背景模式</label>
            <select id="set-bgMode">
                <option value="fluid">动态流体 (Fluid)</option>
                <option value="grid">赛博网格 (Grid)</option>
                <option value="solid">纯色模式 (Solid)</option>
                <option value="gradient">渐变天空 (Gradient)</option>
            </select>
        </div>
        <div class="control-group">
            <label>背景基色</label>
            <input type="color" id="set-bgColor" value="#050508">
        </div>

        <div class="section-title"><span>✍️</span> 文字外观</div>
        <div class="control-group">
            <label>字体族</label>
            <select id="set-clockFont">
                <option value="Orbitron">Orbitron (科技)</option>
                <option value="Share Tech Mono">Share Tech (复古终端)</option>
                <option value="JetBrains Mono">JetBrains (极简开发)</option>
                <option value="Inter">Inter (现代无衬线)</option>
                <option value="Courier New">Classic Mono (经典打印)</option>
            </select>
        </div>
        <div class="control-group">
            <label>文字材质</label>
            <select id="set-material">
                <option value="mat-neon">极光霓虹</option>
                <option value="mat-minimal">极简纯白</option>
                <option value="mat-glass">磨砂半透</option>
                <option value="mat-outline">镂空线条</option>
            </select>
        </div>
        <div class="control-group">
            <label>字体大小</label>
            <input type="range" id="set-clockSize" min="5" max="18" step="0.5" value="8">
        </div>
        <div class="control-group">
            <label>字体粗细 (100-900)</label>
            <input type="range" id="set-clockWeight" min="100" max="900" step="100" value="900">
        </div>

        <div class="section-title"><span>🕹️</span> 交互与特效</div>
        <div class="control-group">
            <label>3D 视角跟随</label>
            <select id="set-enable3D">
                <option value="true">开启动态视差</option>
                <option value="false">锁定平面中心</option>
            </select>
        </div>
        <div class="control-group">
            <label>主色调 (霓虹/网格)</label>
            <input type="color" id="set-neonColor" value="#00f3ff">
        </div>

        <button onclick="location.reload()" style="background:#333; color:white; border:none; padding:12px; width:100%; border-radius:8px; cursor:pointer; margin-top:20px;">重启系统</button>
        <button onclick="document.getElementById('settings-panel').classList.remove('active')" style="background:transparent; color:#666; border:none; width:100%; margin-top:10px; cursor:pointer;">返回</button>
    </div>

    <script>
        // --- 1. 状态管理 ---
        const defaultConfig = {
            bgMode: 'fluid',
            bgColor: '#050508',
            clockFont: 'Orbitron',
            clockSize: 8,
            clockWeight: 900,
            material: 'mat-neon',
            enable3D: true,
            neonColor: '#00f3ff',
            glassOp: 0.1
        };

        let state = JSON.parse(localStorage.getItem('nexus_v4_cfg')) || {...defaultConfig};
        const save = () => localStorage.setItem('nexus_v4_cfg', JSON.stringify(state));

        // --- 2. 绘图引擎 (流体) ---
        const canvas = document.getElementById('fluid-canvas');
        const ctx = canvas.getContext('2d');
        let blobs = [];
        let animationId;

        function initBlobs() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            blobs = Array.from({length: 6}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 300 + 300,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                color: Math.random() > 0.5 ? state.neonColor : '#4d00ff'
            }));
        }

        function animate() {
            if (state.bgMode !== 'fluid') return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            blobs.forEach(b => {
                b.x += b.vx; b.y += b.vy;
                if(b.x<0 || b.x>canvas.width) b.vx *= -1;
                if(b.y<0 || b.y>canvas.height) b.vy *= -1;
                let g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                g.addColorStop(0, b.color + '88');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
            });
            animationId = requestAnimationFrame(animate);
        }

        // --- 3. 核心应用函数 ---
        function applySettings() {
            const root = document.documentElement;
            const body = document.body;
            const canvasEl = document.getElementById('fluid-canvas');
            const gridEl = document.getElementById('cyber-grid');

            // 字体与颜色
            root.style.setProperty('--clock-font', state.clockFont);
            root.style.setProperty('--clock-size', state.clockSize + 'vw');
            root.style.setProperty('--clock-weight', state.clockWeight);
            root.style.setProperty('--neon-color', state.neonColor);
            root.style.setProperty('--bg-color', state.bgColor);

            // 背景模式切换
            canvasEl.style.opacity = (state.bgMode === 'fluid') ? '1' : '0';
            gridEl.style.opacity = (state.bgMode === 'grid') ? '0.15' : '0';
            
            if (state.bgMode === 'gradient') {
                body.style.background = `radial-gradient(circle at center, ${state.neonColor}22 0%, ${state.bgColor} 100%)`;
            } else {
                body.style.background = state.bgColor;
            }

            // 流体引擎调度
            cancelAnimationFrame(animationId);
            if (state.bgMode === 'fluid') animate();

            // 文字材质
            document.getElementById('time-display').className = state.material;

            // 3D 锁定逻辑
            if (state.enable3D === false || state.enable3D === "false") {
                document.getElementById('clock-wrapper').style.transform = `rotateX(0deg) rotateY(0deg)`;
            }

            // 同步表单
            Object.keys(state).forEach(key => {
                const el = document.getElementById('set-' + key);
                if (el) el.value = state[key];
            });
        }

        // --- 4. 交互逻辑 ---
        document.addEventListener('mousemove', (e) => {
            if (state.enable3D === false || state.enable3D === "false") return;
            const x = (window.innerWidth / 2 - e.pageX) / 45;
            const y = (window.innerHeight / 2 - e.pageY) / -35;
            document.getElementById('clock-wrapper').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        document.getElementById('menu-btn').onclick = () => 
            document.getElementById('settings-panel').classList.add('active');

        // 统一监听配置修改
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('change', (e) => {
                const key = e.target.id.replace('set-', '');
                let val = e.target.value;
                if(val === "true") val = true;
                if(val === "false") val = false;
                state[key] = val;
                save();
                applySettings();
                if(key === 'neonColor') initBlobs();
            });
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('time-display').textContent = now.toTimeString().split(' ')[0];
            document.getElementById('date-display').textContent = 
                now.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        // --- 5. 启动 ---
        window.onresize = initBlobs;
        initBlobs();
        applySettings();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
