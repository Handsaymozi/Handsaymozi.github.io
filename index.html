<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我和小钱 ❤️</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --pink: #FF9AA2;
  --pink-light: #FFB7B2;
  --peach: #FFDAC1;
  --mint: #B5EAD7;
  --lavender: #C7CEEA;
  --lavender-light: #E2E4F0;
  --white: #FFF5F5;
  --text: #5D4E5F;
  --text-light: #8B7D8E;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  --radius: 24px;
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-border: rgba(255, 255, 255, 0.5);
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #FFE8EC 0%, #F8E8F0 25%, #E8E8F8 50%, #E8F0F8 75%, #FFE8EC 100%);
  background-attachment: fixed;
  background-size: 400% 400%;
  animation: bgShift 20s ease infinite;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  color: var(--text);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
  user-select: none;
  -webkit-user-select: none;
}

@keyframes bgShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ===== Floating Decorations ===== */
.floating-decorations {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.deco {
  position: absolute;
  font-size: 28px;
  opacity: 0.3;
  animation: floatUp 8s ease-in infinite;
}
@keyframes floatUp {
  0% { transform: translateY(105vh) rotate(0deg) scale(0); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
}

/* ===== Password Overlay ===== */
.password-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #FFE4E8 0%, #F3E0F8 40%, #E0E4F8 100%);
  transition: opacity 0.6s ease, visibility 0.6s ease;
  padding: 20px;
}
.password-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.password-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 48px 36px 36px;
  text-align: center;
  box-shadow: var(--shadow);
  max-width: 380px; width: 100%;
  position: relative; z-index: 1;
}
.password-card .lock-icon { font-size: 64px; margin-bottom: 12px; animation: lockBounce 2s ease-in-out infinite; }
@keyframes lockBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.password-card h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.password-card p { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
.password-card input {
  width: 100%; padding: 14px 20px;
  border: 1.5px solid rgba(255, 154, 162, 0.3);
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.6);
  font-size: 16px; text-align: center;
  color: var(--text); outline: none;
  transition: var(--transition);
  letter-spacing: 4px;
  -webkit-appearance: none;
}
.password-card input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255, 154, 162, 0.15); }
.password-card input::placeholder { color: #d0c4d0; letter-spacing: 2px; }
.password-card button {
  margin-top: 16px; width: 100%; padding: 14px;
  border: none; border-radius: 50px;
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; letter-spacing: 2px;
  transition: var(--transition);
  box-shadow: 0 4px 16px rgba(255, 154, 162, 0.3);
  -webkit-appearance: none;
}
.password-card button:active { transform: scale(0.97); }
.password-error { color: #e88; font-size: 13px; margin-top: 10px; min-height: 18px; }
.password-card.shake { animation: shake 0.5s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* ===== Main App ===== */
.app-container {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: calc(12px + var(--safe-top)) 16px calc(100px + var(--safe-bottom));
}
.hidden-page { display: none !important; }
.page { animation: pageIn 0.35s ease; }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 4px;
  position: relative; z-index: 2;
}
.top-bar .logo { font-size: 20px; font-weight: 700; color: var(--text); }
.top-bar .logout-btn {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  padding: 10px 20px; font-size: 14px; color: var(--text-light);
  cursor: pointer; transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.top-bar .logout-btn:active { color: var(--pink); background: rgba(255,255,255,0.6); }

/* ===== Tab Navigation ===== */
.tab-nav {
  display: flex; gap: 12px; margin-bottom: 24px;
  padding: 6px; background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  position: relative; z-index: 2;
}
.tab-btn {
  flex: 1; padding: 12px 20px; border: none; border-radius: 50px;
  background: transparent; font-size: 15px; font-weight: 500;
  color: var(--text-light); cursor: pointer; transition: var(--transition);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--pink), var(--pink-light));
  color: #fff; font-weight: 600;
  box-shadow: 0 4px 16px rgba(255, 154, 162, 0.25);
}

/* ===== Home Page ===== */
.home-page { display: flex; flex-direction: column; gap: 20px; }
.anniversary-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 36px 28px;
  text-align: center;
  box-shadow: var(--shadow);
}
.anniversary-card .heart-icon { font-size: 48px; margin-bottom: 8px; }
.anniversary-card h2 { font-size: 16px; font-weight: 500; color: var(--text-light); margin-bottom: 4px; }
.anniversary-card .days-count {
  font-size: 56px; font-weight: 700;
  background: linear-gradient(135deg, var(--pink), #E8A0B0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
.anniversary-card .days-label { font-size: 14px; color: var(--text-light); margin-top: 4px; }
.anniversary-card .date-info { font-size: 13px; color: var(--text-light); margin-top: 12px; opacity: 0.7; }

.feature-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.feature-card {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
  min-height: 130px; justify-content: center;
}
.feature-card:active { transform: scale(0.97); background: rgba(255,255,255,0.6); }
.feature-card .card-icon { font-size: 44px; }
.feature-card h3 { font-size: 16px; font-weight: 600; }
.feature-card p { font-size: 13px; color: var(--text-light); line-height: 1.5; }

.love-quote {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
}
.love-quote .quote-text { font-size: 15px; font-style: italic; color: var(--text); line-height: 1.8; }
.love-quote .quote-author { font-size: 13px; color: var(--text-light); margin-top: 8px; }

/* ===== Photo Wall ===== */
.photo-page { display: flex; flex-direction: column; gap: 16px; }
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}
.photo-item {
  aspect-ratio: 1;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  background: var(--glass-bg);
  transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.photo-item:active { transform: scale(0.96); }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  background: linear-gradient(135deg, var(--peach), var(--lavender-light));
}
.photo-upload-hint {
  text-align: center; font-size: 13px; color: var(--text-light);
  padding: 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px dashed var(--glass-border);
  border-radius: var(--radius);
}

/* ===== Lightbox ===== */
.lightbox {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,0.9);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lightbox img {
  max-width: 92vw; max-height: 80vh; border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  pointer-events: none;
}
.lightbox .close-btn {
  position: absolute; top: max(16px, var(--safe-top)); right: 16px;
  font-size: 32px; color: #fff; cursor: pointer; z-index: 2;
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,0.12);
  transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.lightbox .close-btn:active { background: rgba(255,255,255,0.3); }
.lightbox .nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 36px; color: #fff; cursor: pointer;
  width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,0.12);
  transition: var(--transition); user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.lightbox .nav-btn:active { background: rgba(255,255,255,0.3); }
.lightbox .nav-btn.prev { left: 8px; }
.lightbox .nav-btn.next { right: 8px; }

/* ===== Novel Reader ===== */
.novel-page { display: flex; flex-direction: column; gap: 0; }
.reader-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  flex-wrap: wrap;
  position: sticky; top: calc(8px + var(--safe-top)); z-index: 10;
}
.toolbar-group { display: flex; align-items: center; gap: 4px; }
.toolbar-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); color: var(--text);
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.toolbar-btn:active { background: rgba(255, 154, 162, 0.25); }
.toolbar-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); }
.toolbar-divider { width: 1px; height: 20px; background: rgba(0,0,0,0.08); margin: 0 4px; flex-shrink: 0; }
.font-size-display { font-size: 13px; color: var(--text); min-width: 30px; text-align: center; font-weight: 500; }

/* Chapter TOC button */
.toc-btn {
  margin-left: auto; padding: 8px 16px; border-radius: 50px;
  border: 1px solid rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 14px; color: var(--text);
  transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap; flex-shrink: 0;
  min-height: 38px; display: flex; align-items: center; gap: 4px;
}
.toc-btn:active { background: rgba(255, 154, 162, 0.2); }

/* ===== Chapter Drawer ===== */
.drawer-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.4);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.drawer-overlay.open { opacity: 1; visibility: visible; }

.chapter-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 101;
  width: min(320px, 85vw);
  background: #FFFBFD;
  box-shadow: -4px 0 30px rgba(0,0,0,0.12);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
  border-radius: 20px 0 0 20px;
  overflow: hidden;
}
.chapter-drawer.open { transform: translateX(0); }

.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  flex-shrink: 0;
}
.drawer-header h3 { font-size: 17px; font-weight: 600; }
.drawer-close {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: rgba(0,0,0,0.04);
  font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text); transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.drawer-close:active { background: rgba(0,0,0,0.1); }

.drawer-list {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 0 20px;
}
.drawer-volume-title {
  padding: 12px 20px 4px;
  font-size: 12px; font-weight: 600; color: var(--pink);
  text-transform: uppercase; letter-spacing: 1px;
}
.drawer-chapter-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px;
  cursor: pointer;
  transition: background 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  border-left: 3px solid transparent;
}
.drawer-chapter-item:active { background: rgba(255, 154, 162, 0.08); }
.drawer-chapter-item.current {
  background: rgba(255, 154, 162, 0.1);
  border-left-color: var(--pink);
  font-weight: 600;
}
.drawer-chapter-item .ch-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255, 154, 162, 0.15);
  font-size: 11px; font-weight: 600; color: var(--pink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.drawer-chapter-item.current .ch-num { background: var(--pink); color: #fff; }
.drawer-chapter-item .ch-title { font-size: 14px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Reader Container ===== */
.reader-container {
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.reader-content {
  padding: 28px 24px;
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  min-height: 50vh;
  max-height: calc(100vh - 300px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  transition: background 0.3s ease, color 0.3s ease;
}
.reader-content h2 { font-size: 18px; margin-bottom: 14px; font-weight: 600; text-align: center; }
.reader-content p {
  font-size: var(--reader-font-size, 16px);
  line-height: var(--reader-line-height, 2);
  margin-bottom: 14px;
  text-indent: 2em;
}
.reader-content.theme-light { background: #FFFEF9; color: #3a3a3a; }
.reader-content.theme-sepia { background: #F5ECD7; color: #5B4636; }
.reader-content.theme-dark { background: #2A2A35; color: #D0D0D0; }

.reader-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px;
  border-top: 1px solid rgba(0,0,0,0.04);
  flex-shrink: 0;
}
.reader-nav-btn {
  padding: 10px 22px; border-radius: 50px;
  border: 1px solid rgba(0,0,0,0.08);
  background: rgba(255,255,255,0.5);
  cursor: pointer; font-size: 14px; color: var(--text);
  transition: var(--transition);
  -webkit-tap-highlight-color: transparent;
  min-height: 42px;
}
.reader-nav-btn:active { background: rgba(255, 154, 162, 0.2); }
.reader-nav-btn:disabled { opacity: 0.3; pointer-events: none; }
.reader-progress { font-size: 13px; color: var(--text-light); }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: max(30px, calc(20px + var(--safe-bottom))); left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.78); color: #fff;
  padding: 12px 24px; border-radius: 50px;
  font-size: 14px; z-index: 2000;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s ease, transform 0.3s ease;
  opacity: 0; transform: translateX(-50%) translateY(20px);
}

/* ================================================
   MOBILE RESPONSIVE
   ================================================ */

/* Tablet & small desktop */
@media (max-width: 768px) {
  .app-container { padding: calc(8px + var(--safe-top)) 12px calc(80px + var(--safe-bottom)); }
  .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .reader-content { padding: 24px 18px; max-height: calc(100vh - 280px); }
  .reader-toolbar { gap: 6px; padding: 10px 12px; }
}

/* Phone (large) */
@media (max-width: 480px) {
  .app-container { padding: calc(6px + var(--safe-top)) 10px calc(70px + var(--safe-bottom)); }
  .top-bar { padding: 14px 2px; }
  .top-bar .logo { font-size: 18px; }
  .tab-nav { gap: 8px; margin-bottom: 18px; padding: 5px; }
  .tab-btn { font-size: 13px; padding: 10px 12px; min-height: 40px; }
  .feature-cards { grid-template-columns: 1fr; gap: 12px; }
  .feature-card { padding: 22px 18px; min-height: auto; }
  .feature-card .card-icon { font-size: 36px; }
  .anniversary-card { padding: 28px 20px; }
  .anniversary-card .days-count { font-size: 44px; }
  .anniversary-card .heart-icon { font-size: 40px; }
  .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .photo-item { border-radius: 12px; }
  .photo-placeholder { font-size: 32px; }
  .reader-content { padding: 18px 14px; max-height: calc(100vh - 270px); }
  .reader-content h2 { font-size: 16px; }
  .reader-toolbar { gap: 5px; padding: 8px 10px; border-radius: 18px; position: sticky; top: 6px; }
  .toolbar-btn { width: 34px; height: 34px; font-size: 14px; }
  .toolbar-divider { margin: 0 2px; }
  .toc-btn { padding: 6px 12px; font-size: 13px; min-height: 34px; }
  .reader-nav { padding: 12px 14px; }
  .reader-nav-btn { padding: 8px 16px; font-size: 13px; min-height: 38px; }
  .chapter-drawer { width: 80vw; border-radius: 16px 0 0 16px; }
  .password-card { padding: 36px 24px 28px; }
  .password-card h1 { font-size: 19px; }
  .password-card .lock-icon { font-size: 52px; }
  .lightbox .nav-btn { width: 40px; height: 40px; font-size: 28px; }
  .lightbox .close-btn { width: 40px; height: 40px; font-size: 26px; top: max(12px, var(--safe-top)); right: 8px; }
  .deco { font-size: 20px !important; }
}

/* Phone (small) */
@media (max-width: 360px) {
  .app-container { padding: calc(4px + var(--safe-top)) 8px calc(60px + var(--safe-bottom)); }
  .top-bar .logo { font-size: 16px; }
  .tab-btn { font-size: 12px; padding: 8px 10px; min-height: 36px; }
  .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .photo-item { border-radius: 10px; }
  .photo-placeholder { font-size: 28px; }
  .anniversary-card .days-count { font-size: 38px; }
  .reader-content { padding: 14px 10px; max-height: calc(100vh - 260px); }
  .reader-content h2 { font-size: 15px; }
  .reader-content p { font-size: var(--reader-font-size, 15px); }
  .toolbar-btn { width: 30px; height: 30px; font-size: 13px; }
  .toc-btn { padding: 5px 10px; font-size: 12px; min-height: 30px; }
  .reader-nav-btn { padding: 8px 14px; font-size: 12px; min-height: 36px; }
  .chapter-drawer { width: 85vw; }
  .password-card { padding: 28px 18px 24px; }
  .password-card h1 { font-size: 17px; }
}

/* Tablet landscape / desktop hover */
@media (hover: hover) {
  .feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12); }
  .photo-item:hover { transform: scale(1.03); }
  .password-card button:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255, 154, 162, 0.4); }
  .top-bar .logout-btn:hover { color: var(--pink); }
  .toolbar-btn:hover { background: rgba(255, 154, 162, 0.15); }
  .reader-nav-btn:hover { background: rgba(255, 154, 162, 0.15); }
  .toc-btn:hover { background: rgba(255, 154, 162, 0.12); }
  .lightbox .close-btn:hover { background: rgba(255,255,255,0.25); }
  .lightbox .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .drawer-chapter-item:hover { background: rgba(255, 154, 162, 0.06); }
  .drawer-close:hover { background: rgba(0,0,0,0.08); }
}
</style>
</head>
<body>

<!-- Floating Background Decorations -->
<div class="floating-decorations" id="decorations"></div>

<!-- ===== Password Overlay ===== -->
<div class="password-overlay" id="passwordOverlay">
  <div class="password-card" id="passwordCard">
    <div class="lock-icon">🔐</div>
    <h1>欢迎来到我们的秘密花园</h1>
    <p>请输入我们的专属密码</p>
    <input type="password" id="passwordInput" placeholder="····" maxlength="20" autocomplete="off" inputmode="numeric">
    <button onclick="verifyPassword()">💕 进 入</button>
    <div class="password-error" id="passwordError"></div>
  </div>
</div>

<!-- ===== Main App ===== -->
<div class="app-container hidden-page" id="appContainer">
  <div class="top-bar">
    <div class="logo">🏠 我和小钱的家</div>
    <button class="logout-btn" onclick="logout()">🚪 离开</button>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-page="home" onclick="switchPage('home')">💝 纪念日</button>
    <button class="tab-btn" data-page="photo" onclick="switchPage('photo')">📸 照片墙</button>
    <button class="tab-btn" data-page="novel" onclick="switchPage('novel')">📖 小说</button>
  </nav>

  <!-- Home Page -->
  <div class="home-page page" id="homePage">
    <div class="anniversary-card">
      <div class="heart-icon">💕</div>
      <h2>我们已经在一起</h2>
      <div class="days-count" id="daysCount">--</div>
      <div class="days-label">天</div>
      <div class="date-info">从 <span id="startDateDisplay">----年--月--日</span> 开始 ❤️</div>
    </div>
    <div class="feature-cards">
      <div class="feature-card" onclick="switchPage('photo')">
        <div class="card-icon">📸</div><h3>照片墙</h3><p>记录我们的每一个甜蜜瞬间</p>
      </div>
      <div class="feature-card" onclick="switchPage('novel')">
        <div class="card-icon">📖</div><h3>专属小说</h3><p>写给你的每一个故事</p>
      </div>
    </div>
    <div class="love-quote">
      <div class="quote-text">"遇见你，是我这辈子最美丽的意外。"</div>
      <div class="quote-author">—— 写给小钱</div>
    </div>
  </div>

  <!-- Photo Wall Page -->
  <div class="photo-page page hidden-page" id="photoPage">
    <div class="photo-grid" id="photoGrid"></div>
    <div class="photo-upload-hint">💡 把照片放到 <strong>photos</strong> 文件夹，然后在代码里的 PHOTOS 数组中添加照片路径就可以啦～</div>
  </div>

  <!-- Novel Reader Page -->
  <div class="novel-page page hidden-page" id="novelPage">
    <div class="reader-toolbar">
      <div class="toolbar-group">
        <button class="toolbar-btn active" data-theme="light" onclick="setTheme('light')" aria-label="日间模式">☀️</button>
        <button class="toolbar-btn" data-theme="sepia" onclick="setTheme('sepia')" aria-label="护眼模式">📜</button>
        <button class="toolbar-btn" data-theme="dark" onclick="setTheme('dark')" aria-label="夜间模式">🌙</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="changeFontSize(-1)" aria-label="缩小字号">A⁻</button>
        <span class="font-size-display" id="fontSizeDisplay">16</span>
        <button class="toolbar-btn" onclick="changeFontSize(1)" aria-label="放大字号">A⁺</button>
      </div>
      <button class="toc-btn" onclick="openDrawer()">📑 目录</button>
    </div>

    <div class="reader-container">
      <div class="reader-content theme-light" id="readerContent">
        <h2 id="chapterTitle"></h2>
        <div id="chapterBody"></div>
      </div>
      <div class="reader-nav">
        <button class="reader-nav-btn" id="prevChapterBtn" onclick="prevChapter()">← 上一章</button>
        <span class="reader-progress" id="readerProgress"></span>
        <button class="reader-nav-btn" id="nextChapterBtn" onclick="nextChapter()">下一章 →</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Lightbox ===== -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="close-btn" onclick="closeLightbox(event)">&times;</button>
  <button class="nav-btn prev" onclick="lightboxNav(-1, event)">‹</button>
  <img src="" alt="照片" id="lightboxImg">
  <button class="nav-btn next" onclick="lightboxNav(1, event)">›</button>
</div>

<!-- ===== Chapter Drawer ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="chapter-drawer" id="chapterDrawer">
  <div class="drawer-header">
    <h3>📑 目录</h3>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<script>
// ==========================================
// CONFIGURATION - 在这里修改设置
// ==========================================
const CONFIG = {
  password: '1314',
  anniversary: '2024-01-01',
  partnerName: '小钱',
};

// ==========================================
// NOVEL CONTENT - 在这里修改小说内容
// 支持两种方式组织章节目录：
// 1. 不分卷：直接写 chapters 数组
// 2. 分卷：给章节加 volume 字段，同名 volume 的章节会自动归为一卷
//    不写 volume 的章节默认为 "" (不分卷)
// ==========================================
const NOVEL = {
  title: '写给小钱的故事',
  chapters: [
    {
      volume: '第一卷 · 初遇',
      title: '第一章 · 初见',
      content: `
        <p>那是一个再普通不过的日子，阳光透过窗棂，在桌上投下斑驳的光影。</p>
        <p>我坐在角落里，看着人来人往，直到你出现在门口。你穿着一件浅色的外套，笑起来眼睛弯成了月牙。那一刻，周围的一切仿佛都变成了慢镜头，喧闹的世界突然安静下来，只剩下心跳的声音。</p>
        <p>我从来不相信一见钟情，直到遇见你。</p>
        <p>你的声音很轻很柔，像春天的风拂过耳畔。我笨拙地回应着你说的每一句话，生怕说错一个字。后来你告诉我，你觉得那天我特别可爱，像个手足无措的小孩。</p>
        <p>缘分就是这样奇妙的东西吧，在茫茫人海中，两个原本毫无交集的人，就这样相遇了。</p>
      `
    },
    {
      volume: '第一卷 · 初遇',
      title: '第二章 · 心动',
      content: `
        <p>从那天起，我开始期待每一个能够见到你的时刻。</p>
        <p>每天早上醒来，第一件事就是看手机有没有你的消息。你发来的每一个表情包，我都保存了下来。你分享的每一首歌，我都听了无数遍。你随口提到的每一件小事，我都悄悄记在了心里。</p>
        <p>朋友们都说我变了，变得爱笑、变得温柔、变得对生活充满了期待。我想，这就是喜欢一个人的感觉吧。</p>
        <p>我们一起走过傍晚的街道，路灯拉着长长的影子，我走在你的左边，替你挡住来往的车流。其实你不需要我的保护，但我就是想站在那个位置，这样离你更近一点。</p>
        <p>有一天晚上，我们坐在长椅上看着星星。你没有说话，我也没有说话，但那种安静却比任何话语都要动人。好希望时间能永远停在那一刻。</p>
      `
    },
    {
      volume: '第二卷 · 相知',
      title: '第三章 · 秘密',
      content: `
        <p>我开始写日记了。一本专门关于你的日记。</p>
        <p>第一页写着你的名字，第二页画了一个歪歪扭扭的爱心，第三页开始是每天的小事——你今天穿了什么颜色的衣服，说了什么让我偷笑的话，又做了什么让我心动的小动作。</p>
        <p>我把这本日记藏在枕头下面，每天晚上睡觉前都要翻一翻。有时候看着看着就笑了，笑着笑着就觉得自己好傻，但是又觉得好幸福。</p>
        <p>后来你发现了这本日记。我紧张得手心冒汗，你却红着眼眶抱住了我。你说这是你收到过的，最珍贵的礼物。</p>
        <p>其实，最珍贵的礼物是你啊。是你让我的世界变得五彩斑斓，是你让我开始期待每一个明天。</p>
      `
    },
    {
      volume: '第二卷 · 相知',
      title: '第四章 · 约定',
      content: `
        <p>我们一起许下了很多约定。</p>
        <p>约定要一起去看海，在沙滩上写下两个人的名字；约定要一起爬山，在山顶拥抱日出；约定要一起做饭，不管好不好吃都要吃完；约定吵架不许过夜，再生气也要在睡前说晚安。</p>
        <p>最傻的一个约定是，我们说好了八十岁的时候还要手牵手去看樱花。到那个时候，你可能走不快了，那我就慢慢陪你走；你可能看不清了，那我就把樱花的样子讲给你听。</p>
        <p>这些约定不是用来约束我们的，而是用来提醒我们——不管发生什么，都要记得曾在某个瞬间，我们如此坚定地选择过彼此。</p>
        <p>故事还在继续，我想用余生来慢慢写。每一个今天，都是未来最美好的回忆。</p>
      `
    }
  ]
};

// ==========================================
// PHOTOS - 在这里添加照片
// ==========================================
const PHOTOS = [
  // { src: 'photos/photo1.jpg', caption: '照片描述' },
];

// ==========================================
// APP STATE
// ==========================================
let state = {
  currentPage: 'home',
  currentPhotoIndex: 0,
  currentChapter: 0,
  fontSize: 16,
  theme: 'light',
  drawerOpen: false,
  touchStartX: 0,
  touchStartY: 0,
};

// ==========================================
// INITIALIZATION
// ==========================================
function init() {
  createDecorations();
  setupPasswordInput();
  renderChapterDrawer();
  loadSettings();
  updateAnniversary();
  renderPhotos();
  loadChapter(state.currentChapter);
  setupSwipe();
  if (sessionStorage.getItem('lwed_auth') === 'true') {
    showApp();
  }
  setInterval(updateAnniversary, 60000);
}

// ==========================================
// DECORATIONS
// ==========================================
function createDecorations() {
  const container = document.getElementById('decorations');
  const emojis = ['🌸', '💕', '✨', '🦋', '🎀', '💖', '🌷', '⭐', '🧸', '🍰', '💝', '🌙'];
  const isMobile = window.innerWidth < 480;
  const count = isMobile ? 10 : 18;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'deco';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.animationDelay = Math.random() * 8 + 's';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.fontSize = (18 + Math.random() * 20) + 'px';
    container.appendChild(el);
  }
}

// ==========================================
// PASSWORD
// ==========================================
function setupPasswordInput() {
  const input = document.getElementById('passwordInput');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyPassword();
  });
}

function verifyPassword() {
  const input = document.getElementById('passwordInput');
  const error = document.getElementById('passwordError');
  const card = document.getElementById('passwordCard');

  if (input.value === CONFIG.password) {
    error.textContent = '';
    sessionStorage.setItem('lwed_auth', 'true');
    document.getElementById('passwordOverlay').classList.add('hidden');
    showApp();
  } else {
    error.textContent = '密码不对哦～再试一次吧 💕';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    input.value = '';
    input.focus();
  }
}

function showApp() {
  document.getElementById('appContainer').classList.remove('hidden-page');
  updateAnniversary();
}

function logout() {
  sessionStorage.removeItem('lwed_auth');
  document.getElementById('passwordOverlay').classList.remove('hidden');
  document.getElementById('appContainer').classList.add('hidden-page');
  document.getElementById('passwordInput').value = '';
}

// ==========================================
// NAVIGATION
// ==========================================
function switchPage(pageName) {
  state.currentPage = pageName;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === pageName);
  });
  document.getElementById('homePage').classList.toggle('hidden-page', pageName !== 'home');
  document.getElementById('photoPage').classList.toggle('hidden-page', pageName !== 'photo');
  document.getElementById('novelPage').classList.toggle('hidden-page', pageName !== 'novel');
  if (pageName === 'novel') updateReaderUI();
}

// ==========================================
// ANNIVERSARY
// ==========================================
function updateAnniversary() {
  const start = new Date(CONFIG.anniversary + 'T00:00:00');
  const now = new Date();
  const diffTime = now.getTime() - start.getTime();
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  document.getElementById('daysCount').textContent = diffDays >= 0 ? diffDays : '--';
  document.getElementById('startDateDisplay').textContent =
    `${start.getFullYear()}年${start.getMonth() + 1}月${start.getDate()}日`;
}

// ==========================================
// PHOTO WALL
// ==========================================
function renderPhotos() {
  const grid = document.getElementById('photoGrid');
  if (PHOTOS.length === 0) {
    const placeholders = ['🌸', '💕', '🦋', '🎀', '💖', '🌷'];
    grid.innerHTML = placeholders.map((emoji) => `
      <div class="photo-item" onclick="showPlaceholderHint()">
        <div class="photo-placeholder">${emoji}</div>
      </div>
    `).join('');
  } else {
    grid.innerHTML = PHOTOS.map((photo, i) => `
      <div class="photo-item" onclick="openLightbox(${i})">
        <img src="${photo.src}" alt="${photo.caption || '照片'}" loading="lazy">
      </div>
    `).join('');
  }
}

function showPlaceholderHint() {
  showToast('💡 把照片放到 photos 文件夹，然后在代码里的 PHOTOS 数组中添加照片路径就可以啦～');
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2200);
}

function openLightbox(index) {
  if (PHOTOS.length === 0) { showPlaceholderHint(); return; }
  state.currentPhotoIndex = index;
  document.getElementById('lightboxImg').src = PHOTOS[index].src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function lightboxNav(dir, e) {
  if (e) e.stopPropagation();
  if (PHOTOS.length === 0) return;
  state.currentPhotoIndex = (state.currentPhotoIndex + dir + PHOTOS.length) % PHOTOS.length;
  document.getElementById('lightboxImg').src = PHOTOS[state.currentPhotoIndex].src;
}

// Keyboard navigation for lightbox
document.addEventListener('keydown', (e) => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lightboxNav(-1, e);
    if (e.key === 'ArrowRight') lightboxNav(1, e);
  }
  if (e.key === 'Escape' && state.drawerOpen) closeDrawer();
});

// ==========================================
// CHAPTER DRAWER
// ==========================================
function buildVolumeGroups() {
  const groups = [];
  let currentVolume = null;
  NOVEL.chapters.forEach((ch, i) => {
    const volName = ch.volume || '';
    if (volName !== currentVolume) {
      currentVolume = volName;
      groups.push({ volume: volName, chapters: [] });
    }
    groups[groups.length - 1].chapters.push({ ...ch, index: i });
  });
  return groups;
}

function renderChapterDrawer() {
  const list = document.getElementById('drawerList');
  const groups = buildVolumeGroups();
  let html = '';
  groups.forEach(group => {
    if (group.volume) {
      html += `<div class="drawer-volume-title">${group.volume}</div>`;
    }
    group.chapters.forEach(ch => {
      const cls = ch.index === state.currentChapter ? ' current' : '';
      html += `
        <div class="drawer-chapter-item${cls}" onclick="selectChapterFromDrawer(${ch.index})" data-ch="${ch.index}">
          <span class="ch-num">${ch.index + 1}</span>
          <span class="ch-title">${ch.title}</span>
        </div>
      `;
    });
  });
  list.innerHTML = html;
}

function openDrawer() {
  state.drawerOpen = true;
  // Re-render to update current chapter highlight
  renderChapterDrawer();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('chapterDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Auto-scroll to current chapter
  setTimeout(() => {
    const currentItem = document.querySelector('.drawer-chapter-item.current');
    if (currentItem) {
      currentItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 350);
}

function closeDrawer() {
  state.drawerOpen = false;
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('chapterDrawer').classList.remove('open');
  document.body.style.overflow = '';
}

function selectChapterFromDrawer(index) {
  closeDrawer();
  if (index !== state.currentChapter) {
    loadChapter(index);
  }
}

// ==========================================
// NOVEL READER
// ==========================================
function loadChapter(index) {
  index = parseInt(index);
  const ch = NOVEL.chapters[index];
  if (!ch) return;
  state.currentChapter = index;

  document.getElementById('chapterTitle').textContent = ch.title;
  document.getElementById('chapterBody').innerHTML = ch.content;
  document.getElementById('readerContent').scrollTop = 0;

  updateReaderUI();
  saveSettings();
}

function prevChapter() {
  if (state.currentChapter > 0) loadChapter(state.currentChapter - 1);
}

function nextChapter() {
  if (state.currentChapter < NOVEL.chapters.length - 1) loadChapter(state.currentChapter + 1);
}

function updateReaderUI() {
  document.getElementById('prevChapterBtn').disabled = state.currentChapter === 0;
  document.getElementById('nextChapterBtn').disabled = state.currentChapter === NOVEL.chapters.length - 1;
  document.getElementById('readerProgress').textContent =
    `${state.currentChapter + 1} / ${NOVEL.chapters.length}`;
}

function setTheme(theme) {
  state.theme = theme;
  const content = document.getElementById('readerContent');
  content.className = 'reader-content theme-' + theme;
  document.querySelectorAll('[data-theme]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  saveSettings();
}

function changeFontSize(delta) {
  state.fontSize = Math.min(24, Math.max(12, state.fontSize + delta));
  document.getElementById('readerContent').style.setProperty('--reader-font-size', state.fontSize + 'px');
  document.getElementById('fontSizeDisplay').textContent = state.fontSize;
  saveSettings();
}

// ==========================================
// SWIPE GESTURE (for novel reader)
// ==========================================
function setupSwipe() {
  const reader = document.getElementById('readerContent');
  reader.addEventListener('touchstart', (e) => {
    state.touchStartX = e.touches[0].clientX;
    state.touchStartY = e.touches[0].clientY;
  }, { passive: true });
  reader.addEventListener('touchend', (e) => {
    if (state.currentPage !== 'novel') return;
    const dx = e.changedTouches[0].clientX - state.touchStartX;
    const dy = e.changedTouches[0].clientY - state.touchStartY;
    // Only trigger horizontal swipe (not vertical scroll)
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) nextChapter();
      else prevChapter();
    }
  });
}

// ==========================================
// SETTINGS PERSISTENCE (localStorage)
// ==========================================
function saveSettings() {
  localStorage.setItem('lwed_reader_settings', JSON.stringify({
    chapter: state.currentChapter,
    fontSize: state.fontSize,
    theme: state.theme,
  }));
}

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem('lwed_reader_settings'));
    if (saved) {
      state.currentChapter = saved.chapter || 0;
      state.fontSize = saved.fontSize || 16;
      state.theme = saved.theme || 'light';
      document.getElementById('readerContent').style.setProperty('--reader-font-size', state.fontSize + 'px');
      document.getElementById('fontSizeDisplay').textContent = state.fontSize;
      setTheme(state.theme);
    }
  } catch (e) { /* ignore */ }
}

// ==========================================
// STARTUP
// ==========================================
